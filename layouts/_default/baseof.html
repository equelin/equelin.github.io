<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
  {{ block "extrahead" . }}{{ end }}
</head>
<body>
  <a class="skip-link" href="#main">{{ i18n "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="main" class="container" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
